[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fasttcpapi"
version = "0.1.0"
description = "FastAPI-inspired routing for framed TCP protocols"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FastTcpAPI contributors" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

